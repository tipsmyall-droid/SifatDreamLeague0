name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip if exists
        run: unzip -o "SifatDreamLeague_v1 (1).zip" -d project || echo "no zip"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find and fix gradlew
        run: |
          find . -name "gradlew" -type f
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build AAB and APK
        run: |
          GRADLE_DIR=$(find . -name "gradlew" -printf "%h\n" | head -n 1)
          echo "Gradle dir: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: Upload AAB APK
        uses: actions/upload-artifact@v4
        with:
          name: Sifat-AAB-APK
          path: |
            **/build/outputs/**/*.aab
            **/build/outputs/**/*.apk
