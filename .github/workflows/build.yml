name: Build V12 Fixed
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create V12 Fixed Game
        run: |
          # FIXED settings.gradle - আগেরটা ভুল ছিল
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.android.library' version '8.2.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          mkdir -p app/src/main/java/com/sifat/dreamleague
          mkdir -p app/src/main/assets

          # 25MB file to make 31MB APK
          dd if=/dev/zero of=app/src/main/assets/game_data.bin bs=1M count=25

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sifat.dreamleague'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sifat.dreamleague"
                  minSdk 21
                  targetSdk 34
                  versionCode 12
                  versionName "12.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          repositories {
              google()
              mavenCentral()
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Dream League V12">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sifat/dreamleague/GameViewV12.java <<'EOF'
          package com.sifat.dreamleague;
          import android.content.Context; import android.graphics.*; import android.view.MotionEvent; import android.view.View;
          public class GameViewV12 extends View {
              Paint p=new Paint(); float bx=540, by=1000, bvx=0, bvy=0, px=540, py=1300, gkX=540, gkVX=6; int score=0; long start;
              public GameViewV12(Context c){super(c); start=System.currentTimeMillis();}
              protected void onDraw(Canvas canvas){
                  super.onDraw(canvas); canvas.drawColor(Color.parseColor("#0D5C1A"));
                  int w=getWidth(), h=getHeight();
                  p.setColor(Color.WHITE); p.setStrokeWidth(12); p.setStyle(Paint.Style.STROKE);
                  canvas.drawRect(30,80,w-30,h-80,p); canvas.drawLine(w/2,80,w/2,h-80,p); canvas.drawCircle(w/2,h/2,160,p);
                  canvas.drawRect(w/2-250,80,w/2+250,200,p); canvas.drawRect(w/2-250,h-200,w/2+250,h-80,p);
                  gkX+=gkVX; if(gkX<w/2-180||gkX>w/2+180) gkVX*=-1;
                  p.setStyle(Paint.Style.FILL); p.setColor(Color.RED); canvas.drawCircle(gkX,170,50,p);
                  p.setColor(Color.BLUE); canvas.drawCircle(px,py,45,p);
                  p.setColor(Color.WHITE); canvas.drawCircle(bx,by,32,p);
                  bx+=bvx; by+=bvy; bvx*=0.982f; bvy*=0.982f;
                  if(bx<60||bx>w-60) bvx*=-1; if(by<110||by>h-110) bvy*=-1;
                  if(Math.hypot(bx-gkX, by-170)<80){ bvy=12; bvx=(bx-gkX)/4; }
                  if(bx>w/2-230&&bx<w/2+230&&by<200){ if(Math.abs(bx-gkX)>80) score++; bx=540; by=1000; bvx=0; bvy=0; }
                  p.setColor(Color.BLACK); p.setAlpha(150); canvas.drawRect(0,0,w,75,p); p.setAlpha(255);
                  p.setColor(Color.YELLOW); p.setTextSize(45); canvas.drawText("GOAL: "+score+" | 31MB FULL GAME",20,50,p);
                  long left=90-(System.currentTimeMillis()-start)/1000; if(left<0) left=0;
                  p.setColor(Color.WHITE); p.setTextSize(30); canvas.drawText(left+"s", w-100, 50, p);
                  if(left==0){ p.setColor(Color.BLACK); p.setAlpha(200); canvas.drawRect(0,0,w,h,p); p.setAlpha(255); p.setColor(Color.WHITE); p.setTextSize(70); p.setTextAlign(Paint.Align.CENTER); canvas.drawText("FULL TIME "+score, w/2, h/2, p); return; }
                  invalidate();
              }
              public boolean onTouchEvent(MotionEvent e){ px=e.getX(); py=e.getY(); float dx=bx-px, dy=by-py; if(Math.hypot(dx,dy)<180){ bvx=dx/6; bvy=dy/6; } return true; }
          }
          EOF

          cat > app/src/main/java/com/sifat/dreamleague/MainActivity.java <<'EOF'
          package com.sifat.dreamleague; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle s){super.onCreate(s); setContentView(new GameViewV12(this));} }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - run: gradle assembleRelease bundleRelease
      - run: ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: V12-APK-31MB-FIXED
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: V12-AAB-31MB-FIXED
          path: app/build/outputs/bundle/release/*.aab
