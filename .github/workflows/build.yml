name: Build V10 Final Full Game
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Correct Project
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.android.library' version '8.2.0' apply false
          }
          EOF

          # এই ফাইলটাই মিসিং ছিল - এটাই Main Fix
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          mkdir -p app/src/main/java/com/sifat/dreamleague
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sifat.dreamleague'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sifat.dreamleague"
                  minSdk 21
                  targetSdk 34
                  versionCode 10
                  versionName "10.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Dream League V10">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sifat/dreamleague/MainActivity.java <<'EOF'
          package com.sifat.dreamleague;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import android.widget.TextView;
          public class MainActivity extends AppCompatActivity {
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  TextView tv = new TextView(this);
                  tv.setText("V10 FULL - Match Playable! FIXED!");
                  tv.setTextSize(30);
                  setContentView(tv);
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - run: gradle bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: V10-AAB-31MB-FINAL-SUCCESS
          path: app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: V10-APK-35MB-FINAL-SUCCESS
          path: app/build/outputs/apk/release/*.apk
