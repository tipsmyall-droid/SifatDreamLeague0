name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and list files
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done
          ls -la
          find . -type f -name "gradlew" | head -20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build AAB and APK
        run: |
          GRADLE_FILE=$(find . -type f -name "gradlew" | head -n 1)
          echo "Found: $GRADLE_FILE"
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "Dir: $GRADLE_DIR"
          chmod +x "$GRADLE_FILE"
          cd "$GRADLE_DIR"
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: Upload AAB APK
        uses: actions/upload-artifact@v4
        with:
          name: Sifat-AAB-APK
          path: |
            **/build/outputs/**/*.aab
            **/build/outputs/**/*.apk
