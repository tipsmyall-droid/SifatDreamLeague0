name: Build AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o "SifatDreamLeague_v1 (1).zip" -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          cd project
          cd $(ls -d */ | head -n 1)
          chmod +x gradlew
          ./gradlew bundleDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sifat-AAB-APK
          path: |
            project/**/build/outputs/**/*.aab
            project/**/build/outputs/**/*.apk
